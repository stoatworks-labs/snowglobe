name: ci

# A `pull_request` trigger from the first push, so a Dependabot bump has a
# status check to gate its merge on (ferrofluid ran without one for months).
# The repo is public, so Actions minutes are free; a private copy must never
# enable it (the machine's rule: private repos share one small allowance).
#
# macOS and Windows. The CMakeLists branches on APPLE and WIN32 and has no
# Linux path at all, so ubuntu is not an option. The Windows job is pitch's,
# adapted: a GLEW-shaped break is one macOS is structurally blind to, because
# macOS never links GLEW. It also loads the DLL as a host does
# (tools/wincheck.ps1), so a missing runtime or a constructor that throws fails
# here rather than in Arena. It is the first place MSVC compiles snowglobe,
# and the vendored earshot snapshot inside it.
#
# The macOS runner cannot create an accelerated GL context, so the harness runs
# `sgtest --offline`: every check sgtest's checks() marks as needing no GL (the
# fill's model against the GPA's tables, the names, the cue sheet), and their
# negative controls. The shaders are covered the other way, by glslc. Every
# physics and optics claim is read off rendered pixels, so those run in
# tools/verify.sh, on a Mac with a GPU and again on Apple's software renderer
# at 320x180 -- what this runner would fall back to.
#
# No step opens or lists an audio device: sgtest sets SNOWGLOBE_NO_DEVICES=1
# before any plugin exists. On Windows, wincheck's prototype instance runs the
# constructor, which lists no devices (the menu is filled on the first frame
# that needs it) and opens nothing.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          # The FFGL SDK is a submodule. Without this CMake fails at configure
          # time with a missing-directory error that reads like a broken repo.
          submodules: recursive

      - name: Configure
        # arm64 only, unlike the release build's universal arm64;x86_64 — the
        # second slice doubles the build for no extra signal, because a source
        # break is not architecture-specific. Passed as a single value with no
        # semicolon, which the shell would split.
        #
        # SNOWGLOBE_BUILD_TOOLS is ON here where the release build turns it OFF:
        # sgtest is a large slice of the C++, and --offline needs it.
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DSNOWGLOBE_BUILD_TOOLS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Parameters
        # No GL needed, so this one cannot be a runner problem.
        run: ./build/sgtest --list

      - name: Offline checks
        # Physics and registration, with their negative controls, and never a
        # GL context. The set is defined once, in sgtest's main(); it is not
        # listed here, so a new check cannot silently go untested in CI.
        timeout-minutes: 30
        run: ./build/sgtest --offline

      - name: Shaders compile
        # The same script tools/verify.sh runs. GLSLC_REQUIRED: a runner
        # without glslc must fail, not skip.
        run: |
          brew install shaderc
          GLSLC_REQUIRED=1 tools/glslc.sh

      # Uploading is not only for the artefact. This repo has no package
      # manifest, so github-actions is its only Dependabot ecosystem — and a
      # bump to actions/upload-artifact otherwise touches release.yml alone,
      # a workflow no pull request ever runs. Using it here means the check
      # actually exercises the action being bumped.
      - uses: actions/upload-artifact@v7
        with:
          name: snowglobe-macos-arm64
          path: build/*.bundle
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        # The toolchain path MUST stay double-quoted: a `run:` step on Windows
        # is PowerShell, and unquoted this expands to nothing. Tools off: sgtest
        # links CGL and is macOS-only. Applocal off: see release.yml.
        run: >
          cmake -B build -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DSNOWGLOBE_BUILD_TOOLS=OFF
          -DVCPKG_APPLOCAL_DEPS=OFF
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: The DLL, as a host sees it
        # pwsh checks only the LAST exit code of a step: it is checked here.
        # -Params changes whenever a control or the About block does.
        run: |
          ./tools/wincheck.ps1 -Dll "build/Release/Snowglobe.dll" -Name "SW Snowglobe" -Id SG01 -Kind effect -Params 16 -First "Shake"
          if( $LASTEXITCODE ) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v7
        with:
          name: snowglobe-windows-x86_64
          path: build/Release/*.dll
          if-no-files-found: error
